name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tests
        run: node --test

      - name: Manifest
        run: |
          node -e '
            const manifest = JSON.parse(require("fs").readFileSync("manifest.json", "utf8"));
            if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error(`Bad version: ${manifest.version}`);
            if (manifest.manifest_version !== 3) throw new Error("Expected manifest_version 3");
          '

      - name: Build
        run: |
          archive=$(bash scripts/build.sh)
          unzip -Z1 "$archive" | tee files.txt
          if grep -vE '^(manifest\.json|README\.md|LICENSE|icons/([0-9]+\.png)?|src/([a-z]+\.(js|html|css))?)$' files.txt; then
            echo "Archive contains unexpected files" >&2
            exit 1
          fi
          grep -qx 'manifest.json' files.txt
